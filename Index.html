<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAMAJA 2026 | Premium Javanese Heritage</title>
    
    <!-- Import Font Klasik & Modern -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- RESET & VARIABEL --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #D4AF37;
            --gold-light: #F3C623;
            --dark-sogan: #120b06;
            --dark-brown: #2B1B17;
            --text-cream: #FDF5E6;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--dark-sogan);
            font-family: 'Poppins', sans-serif;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* --- BACKGROUND PARTIKEL EMAS MELAYANG --- */
        .gold-dust {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .dust {
            position: absolute;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0.4;
            animation: floatUp linear infinite;
            box-shadow: 0 0 10px var(--gold);
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* --- KARTU UTAMA (3D TILT WRAPPER) --- */
        .card-wrapper {
            perspective: 1000px;
            z-index: 1;
        }

        .poster-card {
            background: linear-gradient(135deg, rgba(43,27,23,0.95) 0%, rgba(18,11,6,0.98) 100%);
            border: 2px solid var(--gold);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 9 / 16;
            padding: 30px 20px 20px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 30px rgba(212, 175, 55, 0.1);
            text-align: center;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
        }

        /* Efek Glow di dalam kartu */
        .poster-card::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(212,175,55,0.1) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* Ornamen Sudut */
        .corner-ornament {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid var(--gold);
            z-index: 10;
            transform: translateZ(20px); /* Efek 3D */
        }
        .top-left { top: 10px; left: 10px; border-right: none; border-bottom: none; border-top-left-radius: 10px; }
        .top-right { top: 10px; right: 10px; border-left: none; border-bottom: none; border-top-right-radius: 10px; }
        .bottom-left { bottom: 10px; left: 10px; border-right: none; border-top: none; border-bottom-left-radius: 10px; }
        .bottom-right { bottom: 10px; right: 10px; border-left: none; border-top: none; border-bottom-right-radius: 10px; }

        /* Running Text */
        .marquee-wrapper {
            background: var(--gold);
            color: var(--dark-sogan);
            font-weight: 600;
            font-size: 0.75rem;
            padding: 6px 0;
            position: absolute;
            top: 0; left: 0; right: 0;
            overflow: hidden;
            white-space: nowrap;
            z-index: 10;
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
        }

        .marquee { display: inline-block; animation: scrollText 12s linear infinite; }
        @keyframes scrollText { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* --- HEADER & LOGO --- */
        .header-section { margin-top: 20px; transform: translateZ(30px); }

        .logo-container {
            width: 85px; height: 85px; margin: 0 auto 10px;
            background: #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px var(--gold); border: 3px solid var(--gold);
            overflow: hidden; position: relative;
        }
        .logo-container img { width: 90%; height: 90%; object-fit: contain; }

        /* --- TEKS UTAMA --- */
        .content-section {
            flex-grow: 1; display: flex; flex-direction: column;
            justify-content: center; transform: translateZ(40px);
        }

        .tagline-top {
            color: var(--gold); font-family: 'Cinzel', serif;
            font-size: 0.8rem; font-weight: 600; letter-spacing: 3px;
            margin-bottom: 8px; text-transform: uppercase;
        }

        h1 {
            font-family: 'Cinzel', serif; font-size: 1.8rem; font-weight: 800;
            line-height: 1.1; color: var(--text-cream);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8), 0 0 15px rgba(212, 175, 55, 0.5);
            margin-bottom: 10px; text-transform: uppercase;
        }

        .tagline-bottom {
            color: #bcaaa4; font-size: 0.8rem; line-height: 1.4;
            margin-bottom: 15px; font-style: italic;
        }

        /* --- COUNTDOWN TIMER --- */
        .countdown-container {
            display: flex; justify-content: center; gap: 10px;
            margin-bottom: 15px;
        }
        .countdown-box {
            background: rgba(0,0,0,0.6); border: 1px solid var(--gold);
            border-radius: 8px; padding: 5px 8px; min-width: 50px;
        }
        .countdown-number {
            color: var(--gold-light); font-family: 'Cinzel', serif;
            font-size: 1.1rem; font-weight: 800;
        }
        .countdown-label {
            color: #bcaaa4; font-size: 0.6rem; text-transform: uppercase;
        }

        /* --- KOTAK INFORMASI --- */
        .info-box {
            background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold);
            border-radius: 8px; padding: 12px; margin-bottom: 15px; text-align: left;
        }

        .info-item {
            display: flex; justify-content: space-between;
            margin-bottom: 6px; font-size: 0.8rem; color: var(--text-cream);
        }
        .info-item:last-child { margin-bottom: 0; }
        .info-label { font-weight: 600; color: var(--gold); font-family: 'Cinzel', serif; }

        /* --- TOMBOL CTA (SHIMMER EFFECT) --- */
        .cta-button {
            display: block; width: 100%;
            background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
            background-size: 200% auto;
            color: var(--dark-sogan); font-family: 'Cinzel', serif;
            font-weight: 800; font-size: 1rem; text-decoration: none;
            padding: 14px; border-radius: 50px; text-transform: uppercase;
            letter-spacing: 1px; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transition: all 0.3s ease; border: none; cursor: pointer;
            margin-bottom: 10px; position: relative; overflow: hidden;
            animation: shimmer 3s infinite linear;
        }

        @keyframes shimmer { to { background-position: 200% center; } }

        .cta-button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.8);
        }

        /* --- TOMBOL COPY LINK --- */
        .copy-btn {
            background: transparent; border: 1px solid var(--gold);
            color: var(--gold); padding: 6px; border-radius: 20px;
            font-size: 0.7rem; cursor: pointer; transition: 0.3s;
            margin-bottom: 15px; display: inline-flex; align-items: center; gap: 5px;
        }
        .copy-btn:hover { background: var(--gold); color: var(--dark-sogan); }

        /* --- FOOTER --- */
        .footer-section {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 12px; border-top: 1px dashed var(--gold);
            margin-bottom: 5px; transform: translateZ(20px);
        }

        .contact-info { text-align: left; font-size: 0.75rem; color: #bcaaa4; line-height: 1.4; }
        .contact-info span { color: var(--gold); font-weight: 600; }
        
        .qr-code {
            background: white; padding: 4px; border-radius: 6px;
            width: 55px; height: 55px;
        }
        .qr-code img { width: 100%; height: 100%; display: block; }

        /* --- PANEL KONTROL (REKAM & FULLSCREEN) --- */
        .controls {
            margin-top: 25px; display: flex; gap: 15px; z-index: 10;
        }

        .btn-control {
            background: var(--dark-brown); color: var(--gold);
            border: 2px solid var(--gold); padding: 10px 20px;
            border-radius: 30px; font-family: 'Poppins', sans-serif;
            font-weight: 600; font-size: 0.9rem; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: all 0.3s ease;
        }

        .btn-control:hover { background: var(--gold); color: var(--dark-sogan); }

        .btn-record-active {
            background: #ff3333 !important; color: white !important;
            border-color: #ff3333 !important; animation: pulseRed 1.5s infinite;
        }
        @keyframes pulseRed {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 51, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); }
        }

        .hidden { display: none !important; }

        /* --- TOAST NOTIFICATION --- */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--gold); color: var(--dark-sogan);
            padding: 12px 24px; border-radius: 30px; font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 999;
            display: flex; align-items: center; gap: 10px;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    </style>
</head>
<body>

    <!-- Efek Partikel Emas -->
    <div class="gold-dust" id="goldDust"></div>

    <div class="card-wrapper" id="cardWrapper">
        <div class="poster-card" id="posterCard">
            
            <!-- Ornamen Sudut -->
            <div class="corner-ornament top-left"></div>
            <div class="corner-ornament top-right"></div>
            <div class="corner-ornament bottom-left"></div>
            <div class="corner-ornament bottom-right"></div>

            <!-- Running Text -->
            <div class="marquee-wrapper">
                <div class="marquee">꧁ RAME ING GAWE, SEPI ING PAMRIH ꧂</div>
            </div>

            <!-- Header -->
            <div class="header-section">
                <div class="logo-container">

                </div>
            </div>

            <!-- Konten Utama -->
            <div class="content-section">
                <p class="tagline-top">Monggo Sedulu</p>
                <h1>Paseduluran<br>Mahasiswa<br>Ngayogyakarta</h1>

                <!-- Live Countdown -->
                <div class="countdown-container" id="countdown">
                    <div class="countdown-box">

                        <div class="countdown-label">Hari</div>
                    </div>
                    <div class="countdown-box">
                        <div class="countdown-number" id="hours">00</div>

                    </div>
                    <div class="countdown-box">
                        <div class="countdown-number" id="minutes">00</div>
                        <div class="countdown-label">Menit</div>
                    </div>
                    <div class="countdown-box">
                        <div class="countdown-number" id="seconds">00</div>
                        <div class="countdown-label">Detik</div>
                    </div>
                </div>

                <div class="info-box">
                    <div class="info-item">
                        <span class="info-label">Pendaftaran</span>
                        <span>s.d. 27 Nov 2026</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">First Meet</span>
                        <span>29 Nov 2026</span>
                    </div>
                </div>

                <!-- Tombol Utama & Copy -->
                <a href="https://bit.ly/Pamaja2026" target="_blank" class="cta-button">
                    Ndaftar Sakniki 🔥
                </a>
                <button class="copy-btn" id="copyBtn">
                    <i class="fa-regular fa-copy"></i> Salin Link Pendaftaran
                </button>
            </div>

            <!-- Footer -->
            <div class="footer-section">
                <div class="contact-info">
                    CP: <span>083185793820</span> (Rian)<br>
                    IG: <a href="https://www.instagram.com/pamaja_26/" target="_blank" style="color:var(--gold); text-decoration:none;">@pamaja_26</a>
                </div>
                <div class="qr-code">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://bit.ly/Pamaja2026" alt="QR Code">
                </div>
            </div>
        </div>
    </div>

    <!-- Panel Kontrol -->
    <div class="controls" id="controlPanel">
        <button class="btn-control" id="btnFullscreen">
            <i class="fa-solid fa-expand"></i> Fullscreen
        </button>
        <button class="btn-control" id="btnRecord">
            <i class="fa-solid fa-circle text-red-500" style="color: #ff3333;"></i> Rekam
        </button>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-check-circle"></i> <span id="toastMsg">Berhasil!</span>
    </div>

    <!-- Script Vanilla Tilt untuk Efek 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.2/vanilla-tilt.min.js"></script>

    <script>
        // --- 1. INISIALISASI EFEK 3D TILT ---
        VanillaTilt.init(document.querySelector("#posterCard"), {
            max: 10,       // Maksimal kemiringan derajat
            speed: 400,    // Kecepatan animasi
            glare: true,   // Efek pantulan cahaya
            "max-glare": 0.3, // Intensitas pantulan
            scale: 1.02    // Sedikit membesar saat di-hover
        });

        // --- 2. GENERATE PARTIKEL EMAS ---
        const goldDust = document.getElementById('goldDust');
        for (let i = 0; i < 40; i++) {
            let dust = document.createElement('div');
            dust.classList.add('dust');
            dust.style.left = Math.random() * 100 + 'vw';
            dust.style.width = Math.random() * 5 + 2 + 'px';
            dust.style.height = dust.style.width;
            dust.style.animationDuration = Math.random() * 10 + 5 + 's';
            dust.style.animationDelay = Math.random() * 5 + 's';
            goldDust.appendChild(dust);
        }

        // --- 3. COUNTDOWN TIMER ---
        const targetDate = new Date("Nov 27, 2026 23:59:59").getTime();
        
        setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById("countdown").innerHTML = "<h2 style='color:var(--gold); font-family:Cinzel;'>PENDAFTARAN DITUTUP</h2>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
        }, 1000);

        // --- 4. TOAST NOTIFICATION FUNCTION ---
        function showToast(message, icon = "fa-check-circle") {
            const toast = document.getElementById("toast");
            const toastMsg = document.getElementById("toastMsg");
            toast.querySelector('i').className = `fa-solid ${icon}`;
            toastMsg.innerText = message;
            
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }

        // --- 5. FITUR COPY LINK ---
        document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText("https://bit.ly/Pamaja2026").then(() => {
                showToast("Link pendaftaran berhasil disalin!", "fa-link");
            }).catch(err => {
                showToast("Gagal menyalin link.", "fa-triangle-exclamation");
            });
        });

        // --- 6. FITUR FULLSCREEN ---
        const btnFullscreen = document.getElementById('btnFullscreen');
        const cardWrapper = document.getElementById('cardWrapper');

        btnFullscreen.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                showToast("Mode Layar Penuh Aktif", "fa-expand");
            } else {
                document.exitFullscreen();
            }
        });

        // --- 7. FITUR REKAM LAYAR (SCREEN RECORDING) ---
        const btnRecord = document.getElementById('btnRecord');
        let mediaRecorder;
        let recordedChunks = [];
        let recordingInterval;
        let secondsRecorded = 0;

        btnRecord.addEventListener('click', async () => {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                showToast("Browser tidak mendukung rekam layar. Gunakan PC/Chrome.", "fa-triangle-exclamation");
                return;
            }

            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: false
                });

                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    stream.getTracks().forEach(track => track.stop());
                    
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Promosi-PAMAJA-${new Date().getTime()}.webm`;
                    a.click();
                    
                    recordedChunks = [];
                    clearInterval(recordingInterval);
                    secondsRecorded = 0;
                    btnRecord.innerHTML = `<i class="fa-solid fa-circle" style="color: #ff3333;"></i> Rekam`;
                    btnRecord.classList.remove('btn-record-active');
                    document.getElementById('controlPanel').classList.remove('hidden');
                    showToast("Rekaman berhasil diunduh!", "fa-download");
                };

                mediaRecorder.start();
                
                // UI saat merekam
                btnRecord.classList.add('btn-record-active');
                secondsRecorded = 0;
                recordingInterval = setInterval(() => {
                    secondsRecorded++;
                    const mins = Math.floor(secondsRecorded / 60).toString().padStart(2, '0');
                    const secs = (secondsRecorded % 60).toString().padStart(2, '0');
                    btnRecord.innerHTML = `<i class="fa-solid fa-stop"></i> ${mins}:${secs}`;
                }, 1000);

                document.getElementById('controlPanel').classList.add('hidden');
                showToast("Mulai merekam... (Klik Stop di browser untuk berhenti)", "fa-video");

                stream.getVideoTracks()[0].onended = () => {
                    mediaRecorder.stop();
                };

            } catch (err) {
                console.error("Error: " + err);
                showToast("Gagal memulai rekaman.", "fa-triangle-exclamation");
            }
        });
    </script>

</body>
</html>
